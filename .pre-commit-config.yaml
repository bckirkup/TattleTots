repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this rev equal to the Ruff version in uv.lock.
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix, "--config=lint.mccabe.max-complexity=15"]
        files: ^(src|tests|scripts|Large Experiments)/.*\.py$
      - id: ruff-format
        files: ^(src|tests|scripts|Large Experiments)/.*\.py$
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        args: [--no-progress]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        language_version: python3.11
        additional_dependencies: [pydantic>=2.0, numpy>=1.24, networkx>=3.0]
        args: [--config-file=pyproject.toml]
        pass_filenames: false
        entry: mypy src/
  - repo: local
    hooks:
      - id: sonar-mechanical-guards
        name: Sonar mechanical guards
        entry: python scripts/sonar_guard.py
        language: system
        files: ^(src|tests|scripts|Large Experiments)/.*\.py$
        types: [python]
      - id: sonar-workflow-guards
        name: Sonar workflow guards
        entry: python scripts/sonar_guard.py --workflows
        language: system
        files: ^\.github/workflows/.*\.(yml|yaml)$
        types: [yaml]
