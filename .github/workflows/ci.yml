name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --no-build --no-binary-package domain-runner --no-binary-package tattletots --extra dev
      - name: Ruff lint
        run: uv run --no-sync --no-build ruff check src/ tests/ scripts/ "Large Experiments/"
      - name: Ruff format check
        run: uv run --no-sync --no-build ruff format --check src/ tests/ scripts/ "Large Experiments/"

  sonar-guard:
    name: Sonar mechanical guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run Sonar mechanical guard
        run: python scripts/sonar_guard.py src tests scripts "Large Experiments"
      - name: Run workflow guards
        run: python scripts/sonar_guard.py --workflows .github/workflows

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --no-build --no-binary-package domain-runner --no-binary-package tattletots --extra dev
      - name: Mypy
        run: uv run --no-sync --no-build mypy src/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --no-build --no-binary-package domain-runner --no-binary-package tattletots --extra dev
      - name: Print numerical environment
        run: |
          uv run --no-sync --no-build python - <<'PY'
          import platform
          import sys

          import numpy as np
          import scipy

          print(f"python: {platform.python_version()} ({sys.executable})")
          print(f"numpy: {np.__version__}")
          print(f"scipy: {scipy.__version__}")
          print("numpy.show_config():")
          np.show_config()
          PY
      - name: Run unit tests
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            uv run --no-sync --no-build pytest -m "not smoke" --cov=tattletots --cov-report=term-missing --cov-report=xml:coverage.xml
          else
            uv run --no-sync --no-build pytest -m "not smoke" --cov=tattletots --cov-report=term-missing
          fi
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
      - name: Run COP relevance and dispatch tests
        run: uv run --no-sync --no-build pytest tests/test_relevance.py tests/test_user_cop.py tests/test_dispatch_integration.py -q

  smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --no-build --no-binary-package domain-runner --no-binary-package tattletots --extra dev
      - name: Run smoke tests
        run: uv run --no-sync --no-build pytest -m smoke --tb=short

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install workflow linter
        run: |
          pip install --only-binary ":all:" zizmor==1.29.0
      - name: Lint workflows
        run: zizmor --no-progress .github/workflows/ci.yml

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: test
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage
      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
